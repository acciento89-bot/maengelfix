name: MaengelFix
options:
  bundleIdPrefix: com.kamilunavo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 0.4.0
    CODE_SIGN_STYLE: Automatic

targets:
  MaengelFix:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    settings:
      base:
        DEVELOPMENT_TEAM: TKG684N5GL
        PRODUCT_BUNDLE_IDENTIFIER: com.kamilunavo.maengelfix
        PRODUCT_NAME: "MängelFix"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "MängelFix"
        INFOPLIST_KEY_NSCameraUsageDescription: "MängelFix benötigt die Kamera, damit du Schäden und Mängel direkt dokumentieren kannst."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "MängelFix benötigt Zugriff auf deine Fotos, damit du vorhandene Aufnahmen zu einem Vorgang hinzufügen kannst."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution: Piotr Kaminski (TKG684N5GL)"
          PROVISIONING_PROFILE_SPECIFIER: "MaengelFix App Store"
          DEVELOPMENT_TEAM: TKG684N5GL
    scheme:
      testTargets: []
