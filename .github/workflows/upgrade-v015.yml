name: MängelFix v0.15 Product Completion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/upgrade-v015.yml']
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/upgrade_v015_product_completion.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/schema.sql server/index.js server/package.json client/src/App.jsx client/src/maengelfix-pro.css client/index.html
          if git diff --cached --quiet; then echo "Nothing to commit"; else git commit -m "Complete MängelFix v0.15 product workflows and production readiness" && git push; fi
