name: MängelFix App Review Fixes
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-v025-app-review-fixes.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply App Review fixes
        run: python3 scripts/upgrade_v025_app_review_fixes.py
      - name: Build web app
        working-directory: client
        run: |
          npm install
          npm run build
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.jsx client/src/maengelfix-pro.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix App Review account deletion and subscription disclosure"
            git push
          fi
