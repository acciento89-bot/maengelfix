name: MängelFix iOS 0.4 Management
on:
  push:
    branches: [ios-app]
    paths:
      - scripts/upgrade_ios_v040_management.py
      - .github/workflows/upgrade-ios-v040-management.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/upgrade_ios_v040_management.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Sources ios/project.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Build iOS 0.4 management account experience"
            git push
          fi
