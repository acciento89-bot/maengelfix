name: Audit Google Play version codes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/navoops-google-version-audit.yml'

permissions:
  contents: write
  id-token: write

env:
  WIF_PROVIDER: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
  GOOGLE_SERVICE_ACCOUNT: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Read bundle version codes
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://androidpublisher.googleapis.com/androidpublisher/v3'
          mkdir -p generated/navoops
          out='generated/navoops/google-version-audit.json'
          echo '[]' > "$out"
          cat > "$RUNNER_TEMP/packages.tsv" <<'EOF'
          NavoKids|com.kamilunavo.navokids
          ZweiCheck|de.kamilunavo.zweicheck
          ArbeitsKlar|de.kamilunavo.arbeitsklar
          WärmeTakt|de.kamilunavo.waermetakt
          Reklaio|de.kamilunavo.reklaio
          MängelFix|com.kamilunavo.maengelfix
          Kintaroq|com.kamilunavo.kintaroq
          NavoPass|de.kamilunavo.navopass
          99,9 %|de.kamilunavo.ninenine
          NavoTap|com.kamilunavo.onemoretap
          KälteCalc|de.kamilunav.kaltecalc
          LüftungsCalc|de.kamilunavo.luftungscalc
          HeizkörperCalc|de.kamilunavo.heizkorpercalc
          RohrCalc|de.kamilunavo.rohrcalc
          AnlagenCheck|de.kamilunavo.servicecheck
          VolumeCalc|de.kamilunavo.volumecalc
          KeepMeter|de.kamilunavo.keepmeter
          Schon erledigt?|com.kamilunavo.schonerledigt
          BrennerCalc|de.kamilunavo.brennercalc
          HydroCalc|de.kamilunavo.hydrocalc
          MAGCalc|de.kamilunavo.magcalc
          EOF
          while IFS='|' read -r name package; do
            body=$(mktemp)
            status=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' \
              "$api/applications/$package/edits")
            if [[ "$status" != 2* ]]; then
              row=$(jq -n --arg name "$name" --arg package "$package" --arg error "edit HTTP $status" '{name:$name,package:$package,versionCodes:[],maxVersionCode:null,error:$error}')
            else
              edit=$(jq -r '.id' "$body")
              bundle_body=$(mktemp)
              bundle_status=$(curl -sS -o "$bundle_body" -w '%{http_code}' \
                -H "Authorization: Bearer $TOKEN" "$api/applications/$package/edits/$edit/bundles")
              if [[ "$bundle_status" == 2* ]]; then
                row=$(jq -c --arg name "$name" --arg package "$package" '{name:$name,package:$package,versionCodes:([.bundles[]?.versionCode] | sort),maxVersionCode:([.bundles[]?.versionCode] | max // null),error:null}' "$bundle_body")
              else
                row=$(jq -n --arg name "$name" --arg package "$package" --arg error "bundles HTTP $bundle_status" '{name:$name,package:$package,versionCodes:[],maxVersionCode:null,error:$error}')
              fi
              curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" "$api/applications/$package/edits/$edit" >/dev/null || true
            fi
            tmp=$(mktemp)
            jq --argjson row "$row" '. + [$row]' "$out" > "$tmp"
            mv "$tmp" "$out"
          done < "$RUNNER_TEMP/packages.tsv"
          jq . "$out"
      - name: Persist audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kamilunavo Automation'
          git config user.email 'automation@kamilunavo.com'
          git add generated/navoops/google-version-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh Google Play version audit'
          git push
