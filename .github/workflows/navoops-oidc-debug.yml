name: NavoOps OIDC Claims Debug

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/navoops-oidc-debug.yml'

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Decode non-secret GitHub OIDC claims
        shell: bash
        env:
          AUDIENCE: https://iam.googleapis.com/projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")
          TOKEN=$(jq -r '.value' <<<"$RESPONSE")
          test -n "$TOKEN"
          PAYLOAD=$(cut -d. -f2 <<<"$TOKEN" | tr '_-' '/+' )
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 "$PAD") 2>/dev/null || true)"
          printf '%s' "$PAYLOAD" | base64 -d 2>/dev/null | jq '{sub,repository,repository_id,repository_owner,repository_owner_id,ref,event_name,workflow,job_workflow_ref,actor}'
