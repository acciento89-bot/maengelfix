name: NavoOps Google API Debug

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/navoops-oidc-debug.yml'

permissions:
  contents: read
  id-token: write

env:
  WIF_PROVIDER: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
  GOOGLE_SERVICE_ACCOUNT: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud with GitHub OIDC
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Diagnose Google Play API response
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          URL='https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.kamilunavo.navokids/tracks/production/releases'
          BODY="$RUNNER_TEMP/google-play-response.json"
          STATUS=$(curl -sS -o "$BODY" -w '%{http_code}' -H "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" -H 'Accept: application/json' "$URL")
          echo "HTTP status: $STATUS"
          jq . "$BODY" 2>/dev/null || cat "$BODY"
          test "$STATUS" = '200'
