name: Match published Maengelfix Android purchase products
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [audit, apply]
        default: audit
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: maengelfix-production-catalog
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Preserve existing prices and make published-build products compatible
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CATALOG_MODE: ${{ inputs.mode }}
        run: python3 scripts/maengelfix-sync-production-products.py
      - uses: actions/upload-artifact@v4
        with:
          name: maengelfix-production-product-compatibility-${{ inputs.mode }}
          path: production-product-compatibility.json
          if-no-files-found: error
          retention-days: 30
