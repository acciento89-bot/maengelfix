name: Fix MängelFix App Store ID
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-correct-app-store-id.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_correct_app_store_id_6801253878.py
      - name: Build web app
        working-directory: client
        run: |
          npm install
          npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.jsx scripts/upgrade_v025_public_app_store_link.py scripts/upgrade_v026_official_apple_badge.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix MängelFix App Store ID"
            git push
          fi
