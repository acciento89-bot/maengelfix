name: NavoOps Google Play Track Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  WIF_PROVIDER: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
  GOOGLE_SERVICE_ACCOUNT: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com
  EXPECTED_PACKAGES_SHA256: be62abdb36c2e71de25cefe7948c5af339eb0eccbb9b755c1e606abbb94dc043

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Test cleanup and bounded request behavior without network
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s .github/navoops-preflight/tests -v
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Inventory approved production apps and clean owned edits
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/navoops-preflight/preflight.py \
            --expected-catalog-sha256 "$EXPECTED_PACKAGES_SHA256" \
            --report "$RUNNER_TEMP/navoops-preflight/report.json"
      - name: Preserve preflight and exact cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-play-production-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/navoops-preflight/report.json
          if-no-files-found: error
          retention-days: 7
