name: Review verified icon-fix releases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-icon-fix-releases.yml'
      - '.github/play-review-20260912.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: play-icon-fix-review-20260912
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Prepare missing drafts and verify actual review lifecycle
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error, datetime
          API = 'https://androidpublisher.googleapis.com/androidpublisher/v3'
          allowed = {'de.kamilunavo.navopass': 9, 'de.kamilunavo.servicecheck': 2,
                     'com.kamilunavo.kintaroq': 3, 'de.kamilunav.kaltecalc': 2,
                     'de.kamilunavo.luftungscalc': 2, 'de.kamilunavo.heizkorpercalc': 2}
          draft_apps = {'de.kamilunav.kaltecalc', 'de.kamilunavo.luftungscalc', 'de.kamilunavo.heizkorpercalc'}
          plan = json.loads(pathlib.Path('.github/play-review-20260912.json').read_text())
          if plan.get('schema') != 1 or len(plan['releases']) != 6:
              raise SystemExit('Unexpected review plan')
          seen = set()
          for item in plan['releases']:
              p = item['package']
              if p in seen or allowed.get(p) != item['versionCode'] or item['track'] != 'production' or len(item['sha256']) != 64:
                  raise SystemExit('Invalid or unauthorized release')
              seen.add(p)
          def request(path, method='GET', body=None):
              payload = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(API + path, data=payload, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['PLAY_ACCESS_TOKEN'], 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as res:
                      content = res.read()
                      return json.loads(content) if content else {}
              except urllib.error.HTTPError as exc:
                  text = exc.read().decode('utf-8', 'replace')
                  try: detail = json.loads(text)
                  except ValueError: detail = {'error': {'message': text[:1000]}}
                  raise RuntimeError(json.dumps({'http': exc.code, 'response': detail})) from None
          prefix = 'RELEASE_LIFECYCLE_STATE_'
          finished = {prefix + x for x in ['IN_REVIEW', 'APPROVED_NOT_PUBLISHED', 'PUBLISHED']}
          rows = []
          for item in plan['releases']:
              package, code = item['package'], item['versionCode']
              row = {'package': package, 'targetVersionCode': code, 'releaseName': item['releaseName'],
                     'operation': 'read_only', 'reviewSubmitted': False}
              base = '/applications/' + package
              edit = None
              try:
                  before = request(base + '/tracks/production/releases').get('releases', [])
                  row['lifecycleBefore'] = before
                  exact = [r for r in before if any(a.get('versionCode') == code for a in r.get('activeArtifacts', []))]
                  if any(r.get('releaseLifecycleState') in finished for r in exact):
                      row['operation'] = 'already_submitted_or_published'
                  elif exact:
                      row['operation'] = 'existing_release_preserved_console_action_required'
                  elif any(r.get('releaseLifecycleState') == prefix + 'IN_REVIEW' for r in before):
                      row['operation'] = 'existing_review_preserved'
                  else:
                      edit = request(base + '/edits', 'POST', {})['id']
                      ep = base + '/edits/' + edit
                      bundles = request(ep + '/bundles').get('bundles', [])
                      if len([b for b in bundles if b['versionCode'] == code and b.get('sha256', '').lower() == item['sha256'].lower()]) != 1:
                          raise RuntimeError('Target bundle hash mismatch')
                      if any(b['versionCode'] > code for b in bundles):
                          raise RuntimeError('Newer bundle exists; refusing downgrade')
                      track = request(ep + '/tracks/production')
                      if any(r.get('status') in ['inProgress', 'halted'] for r in track.get('releases', [])):
                          raise RuntimeError('Existing rollout requires individual handling')
                      release = {'name': item['releaseName'], 'versionCodes': [str(code)],
                                 'status': 'draft' if package in draft_apps else 'completed',
                                 'releaseNotes': item['releaseNotes']}
                      request(ep + '/tracks/production', 'PUT', {'track': 'production', 'releases': [release]})
                      request(ep + ':validate', 'POST')
                      try:
                          request(ep + ':commit?changesNotSentForReview=false&changesInReviewBehavior=ERROR_IF_IN_REVIEW', 'POST')
                      except RuntimeError as exc:
                          if 'changesNotSentForReview' not in str(exc) or 'CHANGES_ALREADY_IN_REVIEW' in str(exc):
                              raise
                          row['consoleRequiredReason'] = str(exc)
                          request(ep + ':commit?changesNotSentForReview=true&changesInReviewBehavior=ERROR_IF_IN_REVIEW', 'POST')
                      edit = None
                      row['operation'] = 'draft_saved' if release['status'] == 'draft' else 'release_saved'
                  row['lifecycleAfter'] = request(base + '/tracks/production/releases').get('releases', [])
                  exact_after = [r for r in row['lifecycleAfter'] if any(a.get('versionCode') == code for a in r.get('activeArtifacts', []))]
                  row['reviewSubmitted'] = any(r.get('releaseLifecycleState') in finished for r in exact_after)
                  row['targetLifecycleStates'] = [r.get('releaseLifecycleState') for r in exact_after]
                  edit = request(base + '/edits', 'POST', {})['id']
                  row['productionTrackAfter'] = request(base + '/edits/' + edit + '/tracks/production')
                  row['bundleAssignedToProduction'] = any(str(code) in r.get('versionCodes', []) for r in row['productionTrackAfter'].get('releases', []))
                  if not row['reviewSubmitted']:
                      row['requiredAction'] = 'Complete the first production release in Play Console, then send changes for review.' if package in draft_apps else 'Send the prepared changes for review from the Play Console publishing overview.'
              except Exception as exc:
                  row['error'] = str(exc)
              finally:
                  if edit is not None:
                      try: request(base + '/edits/' + edit, 'DELETE')
                      except Exception as exc: row['cleanupError'] = str(exc)
              rows.append(row)
              print('PLAY_RESULT ' + json.dumps(row, ensure_ascii=True), flush=True)
          report = {'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'releases': rows}
          pathlib.Path('play-review-report.json').write_text(json.dumps(report, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('| Release | Actual lifecycle | Review confirmed |\n|---|---|---|\n')
              for r in rows:
                  out.write('| ' + r['releaseName'] + ' | ' + ', '.join(r.get('targetLifecycleStates', [])) + ' | ' + str(r['reviewSubmitted']) + ' |\n')
          if any('error' in r for r in rows):
              raise SystemExit('Some release operations failed; inspect the receipt.')
          if not all(r['reviewSubmitted'] for r in rows):
              raise SystemExit('Release preparation verified, but Google still requires Play Console review actions. No false review success.')
          PY
      - name: Preserve non-secret review receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-review-report-${{ github.run_id }}
          path: play-review-report.json
          if-no-files-found: warn
          retention-days: 7
