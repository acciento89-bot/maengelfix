name: Fix iOS download behavior

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ios-download-behavior.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply focused fix
        run: python3 scripts/fix_ios_download_behavior.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js client/src/App.jsx
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix iOS download prompts without changing deployment"
            git push
          fi
