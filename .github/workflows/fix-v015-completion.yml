name: MängelFix v0.15 Completion Fixes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-v015-completion.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/fix_v015_completion.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js client/src/App.jsx
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Polish MängelFix v0.15 private and account flows"
            git pull --rebase origin main
            git push
          fi
