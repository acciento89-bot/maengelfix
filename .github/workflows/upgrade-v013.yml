name: MängelFix v0.13 Upgrade
on:
  push:
    branches: [main]
    paths: ['.github/workflows/upgrade-v013.yml']
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/upgrade_v013_handover.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/schema.sql server/index.js server/package.json client/src/App.jsx client/src/maengelfix-pro.css
          if git diff --cached --quiet; then echo "Nothing to commit"; else git commit -m "Build MängelFix v0.13 handover protocols and defect conversion" && git push; fi
