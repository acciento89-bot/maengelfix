name: Upload icon-safe AAB to Google Play
# Retry after KMS signing action exports the Gradle-compatible store password alias.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upload-icon-safe-aab.yml'

permissions:
  contents: read
  id-token: write

env:
  PACKAGE_NAME: com.kamilunavo.maengelfix
  EXPECTED_VERSION_CODE: '6'
  WIF_PROVIDER: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
  GOOGLE_SERVICE_ACCOUNT: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.5.0'}
      - name: Restore upload identity from KMS vault
        uses: acciento89-bot/maengelfix/.github/actions/restore-android-signing@main
        with:
          app-id: maengelfix
      - name: Build and verify signed release bundle
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
          gradle -p android testDebugUnitTest bundleRelease --stacktrace
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$AAB"
          if ! jarsigner -verify "$AAB" 2>/dev/null | grep -Fq 'jar verified.'; then
            jarsigner -keystore "$ANDROID_UPLOAD_KEYSTORE_PATH" -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" -keypass "$ANDROID_UPLOAD_KEY_PASSWORD" "$AAB" "$ANDROID_UPLOAD_KEY_ALIAS"
          fi
          jarsigner -verify "$AAB" | grep -Fq 'jar verified.'
          grep -Fq 'versionCode = 6' android/app/build.gradle.kts
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Check whether version already exists
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://androidpublisher.googleapis.com/androidpublisher/v3'
          edit=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$PACKAGE_NAME/edits" | jq -r '.id')
          bundles=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$edit/bundles")
          if jq -e --argjson code "$EXPECTED_VERSION_CODE" '.bundles | any(.versionCode == $code)' <<<"$bundles" >/dev/null; then
            echo 'ALREADY_PRESENT=true' >> "$GITHUB_ENV"
            echo "$PACKAGE_NAME versionCode $EXPECTED_VERSION_CODE already exists in Google Play"
          else
            echo 'ALREADY_PRESENT=false' >> "$GITHUB_ENV"
          fi
          curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$edit" >/dev/null
      - name: Upload and verify Play bundle
        if: env.ALREADY_PRESENT != 'true'
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://androidpublisher.googleapis.com/androidpublisher/v3'; upload='https://androidpublisher.googleapis.com/upload/androidpublisher/v3'
          edit=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$PACKAGE_NAME/edits" | jq -r '.id')
          body=$(mktemp)
          status=$(curl -sS -o "$body" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/octet-stream' --data-binary "@$AAB_PATH" "$upload/applications/$PACKAGE_NAME/edits/$edit/bundles?uploadType=media")
          if [[ "$status" != 200 ]]; then cat "$body" >&2; curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$edit" >/dev/null || true; exit 1; fi
          test "$(jq -r '.versionCode' "$body")" = "$EXPECTED_VERSION_CODE"
          body=$(mktemp)
          status=$(curl -sS -o "$body" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$PACKAGE_NAME/edits/$edit:commit")
          if [[ "$status" != 2* ]]; then cat "$body" >&2; exit 1; fi
          fresh=$(curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$api/applications/$PACKAGE_NAME/edits" | jq -r '.id')
          curl -fsS -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$fresh/bundles" | jq -e --argjson code "$EXPECTED_VERSION_CODE" '.bundles | any(.versionCode == $code)' >/dev/null
          curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" "$api/applications/$PACKAGE_NAME/edits/$fresh" >/dev/null
          echo "$PACKAGE_NAME versionCode $EXPECTED_VERSION_CODE uploaded and verified"
      - name: Destroy restored signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/kamilunavo-upload.jks"
          rm -rf "$RUNNER_TEMP/kamilunavo-signing-vault"
