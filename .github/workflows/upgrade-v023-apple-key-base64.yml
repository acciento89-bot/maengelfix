name: MängelFix Apple Key Base64 Upgrade
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-v023-apple-key-base64.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/upgrade_v023_apple_key_base64.py
      - run: node --check server/index.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js docker-compose.yml .env.example
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Support base64 Apple IAP private key"
            git push
          fi
