name: MängelFix v0.22 Web Case Reliability

on:
  push:
    branches: [v022-web-case-reliability]
    paths: ['.github/workflows/upgrade-v022-case-reliability.yml']

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: v0.22 Website-Patch anwenden
        run: python3 scripts/upgrade_v022_case_reliability.py

      - name: Server-Syntax prüfen
        run: node --check server/index.js

      - name: Patch-Marker prüfen
        run: |
          grep -q 'V022_CASE_DELETE_ENDPOINT' server/index.js
          grep -q 'V022_DEADLINE_ATOMIC_CLAIM' server/index.js
          grep -q 'V022_BRANDED_APP_MAIL' server/index.js
          grep -q 'V022_CASE_DELETE_ACTION' client/src/App.jsx
          grep -q "import './v022.css';" client/src/main.jsx

      - name: Frontend bauen
        working-directory: client
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Docker-Image bauen
        run: docker build -t maengelfix:v022-ci .

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js client/src/App.jsx client/src/main.jsx client/src/v022.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix MängelFix web case status reminders mail and deletion"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
