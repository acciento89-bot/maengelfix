name: Android CI

on:
  push:
    branches:
      - 'android/**'
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle -p android testDebugUnitTest --stacktrace
      - name: Build debug bundle
        run: gradle -p android bundleDebug --stacktrace
      - name: Build release bundle
        run: gradle -p android bundleRelease --stacktrace
      - name: Verify Play policy, mobile UX and release identity
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/bundle/release/app-release.aab
          grep -Fq 'applicationId = "com.kamilunavo.maengelfix"' android/app/build.gradle.kts
          grep -Fq 'versionCode = 3' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.0.2"' android/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android/app/build.gradle.kts
          grep -Fq 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/res/drawable/maengelfix_launcher_background.xml
          test -s android/app/src/main/res/drawable/maengelfix_launcher_foreground.xml
          grep -Fq 'statusBarsPadding' android/app/src/main/java/com/kamilunavo/maengelfix/MainActivity.kt
          grep -Fq 'modalClose = document.querySelector' android/app/src/main/java/com/kamilunavo/maengelfix/MainActivity.kt
          grep -Fq '.workspaceSidebar nav button>span{display:none!important}' android/app/src/main/java/com/kamilunavo/maengelfix/MainActivity.kt
          grep -Fq '.modal.proModal' android/app/src/main/java/com/kamilunavo/maengelfix/MainActivity.kt
          grep -Fq 'com.android.billingclient:billing-ktx:9.1.0' android/app/build.gradle.kts
          grep -Fq 'com.android.vending.BILLING' android/app/src/main/AndroidManifest.xml
          grep -Fq 'setObfuscatedAccountId(accountHash)' android/app/src/main/java/com/kamilunavo/maengelfix/BillingManager.kt
          grep -Fq '/api/billing/google-play/verify' android/app/src/main/java/com/kamilunavo/maengelfix/BillingManager.kt
          grep -Fq 'verifyWithServer(productId, purchase.purchaseToken)' android/app/src/main/java/com/kamilunavo/maengelfix/BillingManager.kt
          grep -Fq 'acknowledgePurchase' android/app/src/main/java/com/kamilunavo/maengelfix/BillingManager.kt
          grep -Fq 'ensurePurchaseAllowed()' android/app/src/main/java/com/kamilunavo/maengelfix/BillingManager.kt
          grep -Fq 'maengelfix://play-billing' android/app/src/main/java/com/kamilunavo/maengelfix/MainActivity.kt
          grep -Fq 'Käufe wiederherstellen' android/app/src/main/java/com/kamilunavo/maengelfix/PlayBillingSheet.kt
          for product in \
            com.kamilunavo.maengelfix.privatepro.monthly \
            com.kamilunavo.maengelfix.privatepro.yearly \
            com.kamilunavo.maengelfix.managementstarter.monthly \
            com.kamilunavo.maengelfix.managementstarter.yearly \
            com.kamilunavo.maengelfix.managementpro.monthly \
            com.kamilunavo.maengelfix.managementpro.yearly \
            com.kamilunavo.maengelfix.managementbusiness.monthly \
            com.kamilunavo.maengelfix.managementbusiness.yearly; do
            grep -Fq "$product" android/app/src/main/java/com/kamilunavo/maengelfix/BillingManager.kt
          done
          grep -Fq '/api/billing/checkout' android/app/src/main/java/com/kamilunavo/maengelfix/MainActivity.kt
          grep -Fq 'host == "stripe.com" || host.endsWith(".stripe.com")' android/app/src/main/java/com/kamilunavo/maengelfix/MainActivity.kt
          if grep -RFn --include='*.kt' --include='*.xml' \
            -e 'STRIPE_SECRET' \
            -e 'APPLE_IAP_PRIVATE' \
            -e 'GOOGLE_PLAY_SERVICE_ACCOUNT' \
            -e 'GOOGLE_PLAY_RTDN_SERVICE_ACCOUNT_EMAIL' \
            android/app/src; then
            echo 'Server-only secret marker found in Android source.' >&2
            exit 1
          fi
      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: MaengelFix-1.0.2-3-unsigned-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
