name: Android CI

on:
  push:
    branches:
      - main
      - 'android/**'
    paths:
      - 'android/**'
      - 'store/apple/app-icon-1024.png'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'store/apple/app-icon-1024.png'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify exact App Store, Android launcher and splash icon identity
        shell: bash
        run: |
          set -euo pipefail
          ios_icon='store/apple/app-icon-1024.png'
          android_icon='android/app/src/main/res/drawable-nodpi/maengelfix_app_icon.png'
          play_icon='android/store/google-play/icon-512.png'
          test -s "$ios_icon" && test -s "$android_icon" && test -s "$play_icon"
          cmp -s "$ios_icon" "$android_icon"
          grep -Fq 'android:icon="@drawable/maengelfix_app_icon"' android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'android:roundIcon=' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:windowSplashScreenAnimatedIcon">@drawable/maengelfix_app_icon' android/app/src/main/res/values-v31/themes.xml
          test ! -e android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test ! -e android/app/src/main/res/drawable/ic_launcher.xml
          test ! -e android/app/src/main/res/drawable/maengelfix_launcher_background.xml
          test ! -e android/app/src/main/res/drawable/maengelfix_launcher_foreground.xml
          sha256sum "$ios_icon" "$android_icon" "$play_icon"
      - name: Unit tests
        run: gradle -p android testDebugUnitTest --stacktrace
      - name: Build debug bundle
        run: gradle -p android bundleDebug --stacktrace
      - name: Build release bundle
        run: gradle -p android bundleRelease --stacktrace
      - name: Verify Play policy, mobile UX and release identity
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/bundle/release/app-release.aab
          grep -Fq 'applicationId = "com.kamilunavo.maengelfix"' android/app/build.gradle.kts
          grep -Fq 'versionCode = 6' android/app/build.gradle.kts
          grep -Fq 'versionName = "1.0.5"' android/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android/app/build.gradle.kts
          grep -Fq 'android:icon="@drawable/maengelfix_app_icon"' android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'android:roundIcon=' android/app/src/main/AndroidManifest.xml
          grep -Fq 'class MainActivity : ComponentActivity()' android/app/src/main/java/com/kamilunavo/maengelfix/NativeMainActivity.kt
          grep -Fq 'private val MfPrimary = Color(0xFF2457D6)' android/app/src/main/java/com/kamilunavo/maengelfix/NativeMainActivity.kt
          grep -Fq 'CreateCaseScreen' android/app/src/main/java/com/kamilunavo/maengelfix/NativeMainActivity.kt
          grep -Fq 'CaseDetailScreen' android/app/src/main/java/com/kamilunavo/maengelfix/NativeMainActivity.kt
          grep -Fq 'ManagementOverview' android/app/src/main/java/com/kamilunavo/maengelfix/Models.kt
          grep -Fq 'uploadImages' android/app/src/main/java/com/kamilunavo/maengelfix/NativeApiClient.kt
          if grep -RFn --include='*.kt' -e 'AndroidView' -e 'WebView(' android/app/src/main/java; then
            echo 'WebView wrapper found: MängelFix Android must remain fully native.' >&2
            exit 1
          fi
          grep -Fq 'com.android.billingclient:billing-ktx:9.1.0' android/app/build.gradle.kts
          grep -Fq 'com.android.vending.BILLING' android/app/src/main/AndroidManifest.xml
          grep -Fq 'setObfuscatedAccountId(accountHash)' android/app/src/main/java/com/kamilunavo/maengelfix/BillingManager.kt
          grep -Fq '/api/billing/google-play/verify' android/app/src/main/java/com/kamilunavo/maengelfix/BillingManager.kt
          grep -Fq 'verifyWithServer(productId, purchase.purchaseToken)' android/app/src/main/java/com/kamilunavo/maengelfix/BillingManager.kt
          grep -Fq 'acknowledgePurchase' android/app/src/main/java/com/kamilunavo/maengelfix/BillingManager.kt
          grep -Fq 'ensurePurchaseAllowed()' android/app/src/main/java/com/kamilunavo/maengelfix/BillingManager.kt
          grep -Fq 'Google-Play-Angebote ansehen' android/app/src/main/java/com/kamilunavo/maengelfix/NativeMainActivity.kt
          grep -Fq 'Käufe wiederherstellen' android/app/src/main/java/com/kamilunavo/maengelfix/PlayBillingSheet.kt
          for product in \
            maengelfix.private.monthly \
            maengelfix.private.yearly \
            maengelfix.starter.monthly \
            maengelfix.starter.yearly \
            maengelfix.pro.monthly \
            maengelfix.pro.yearly \
            maengelfix.business.monthly \
            maengelfix.business.yearly; do
            grep -Fq "$product" android/app/src/main/java/com/kamilunavo/maengelfix/BillingManager.kt
          done
          if grep -RFn --include='*.kt' --include='*.xml' \
            -e 'STRIPE_SECRET' \
            -e 'APPLE_IAP_PRIVATE' \
            -e 'GOOGLE_PLAY_SERVICE_ACCOUNT' \
            -e 'GOOGLE_PLAY_RTDN_SERVICE_ACCOUNT_EMAIL' \
            android/app/src; then
            echo 'Server-only secret marker found in Android source.' >&2
            exit 1
          fi
      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: MaengelFix-1.0.5-6-unsigned-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
