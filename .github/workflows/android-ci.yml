name: Android CI

on:
  push:
    branches:
      - 'android/**'
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle -p android testDebugUnitTest --stacktrace
      - name: Build debug bundle
        run: gradle -p android bundleDebug --stacktrace
      - name: Build release bundle
        run: gradle -p android bundleRelease --stacktrace
      - name: Verify Play policy and release identity
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          grep -q 'applicationId = "com.kamilunavo.maengelfix"' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          grep -q '/api/billing/checkout' android/app/src/main/java/com/kamilunavo/maengelfix/MainActivity.kt
          grep -q 'host.endsWith("stripe.com")' android/app/src/main/java/com/kamilunavo/maengelfix/MainActivity.kt
          ! grep -R --include='*.kt' --include='*.xml' 'STRIPE_SECRET\|APPLE_IAP_PRIVATE' android/
      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: MaengelFix-unsigned-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
