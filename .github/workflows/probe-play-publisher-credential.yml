name: Probe Play publisher credential

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-play-publisher-credential.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report configured credential aliases only
        shell: bash
        env:
          C1: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64 }}
          C2: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          C3: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          C4: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          C5: ${{ secrets.GOOGLE_PLAY_CREDENTIALS }}
          C6: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          C7: ${{ secrets.PLAY_PUBLISHER_JSON }}
          C8: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          C9: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          C10: ${{ secrets.PLAY_CONFIG_JSON }}
        run: |
          set -euo pipefail
          found=0
          check() { if [ -n "$2" ]; then echo "configured:$1"; found=1; fi; }
          check GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64 "$C1"
          check GOOGLE_PLAY_SERVICE_ACCOUNT_JSON "$C2"
          check GOOGLE_PLAY_SERVICE_ACCOUNT "$C3"
          check GOOGLE_PLAY_JSON_KEY "$C4"
          check GOOGLE_PLAY_CREDENTIALS "$C5"
          check PLAY_SERVICE_ACCOUNT_JSON "$C6"
          check PLAY_PUBLISHER_JSON "$C7"
          check SERVICE_ACCOUNT_JSON "$C8"
          check GOOGLE_SERVICE_ACCOUNT_JSON "$C9"
          check PLAY_CONFIG_JSON "$C10"
          if [ "$found" -eq 0 ]; then
            echo 'No candidate Play publisher credential secret is configured.'
          fi
