name: Configure Kamilunavo WIF trust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-wif-update-permission.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  WIF_PROVIDER: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
  GOOGLE_SERVICE_ACCOUNT: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com
  OWNER_ID: '309368001'

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Configure provider for all acciento89-bot repositories
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          url='https://iam.googleapis.com/v1/projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions'
          condition="assertion.repository_owner == 'acciento89-bot' && assertion.repository_owner_id == '$OWNER_ID'"
          payload=$(jq -n --arg condition "$condition" '{
            attributeCondition:$condition,
            attributeMapping:{
              "google.subject":"assertion.sub",
              "attribute.repository_owner_id":"assertion.repository_owner_id",
              "attribute.repository_owner":"assertion.repository_owner",
              "attribute.repository":"assertion.repository"
            }
          }')
          body=$(mktemp)
          status=$(curl -sS -o "$body" -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data "$payload" "$url?updateMask=attributeCondition,attributeMapping")
          echo "PATCH HTTP $status"
          cat "$body" | jq . || cat "$body"
          [[ "$status" = 200 ]]

          operation=$(jq -r '.name // empty' "$body")
          if [[ "$operation" == *'/operations/'* ]]; then
            operation_url="https://iam.googleapis.com/v1/$operation"
            done_flag=false
            for i in $(seq 1 30); do
              op=$(mktemp)
              curl -fsS -H "Authorization: Bearer $TOKEN" "$operation_url" > "$op"
              if [[ "$(jq -r '.done // false' "$op")" = true ]]; then
                if jq -e '.error' "$op" >/dev/null; then
                  cat "$op" >&2
                  exit 1
                fi
                done_flag=true
                break
              fi
              sleep 2
            done
            [[ "$done_flag" = true ]]
          fi

          verify=$(mktemp)
          curl -fsS -H "Authorization: Bearer $TOKEN" "$url" > "$verify"
          actual=$(jq -r '.attributeCondition' "$verify")
          echo "Verified provider condition: $actual"
          [[ "$actual" = "$condition" ]]
          [[ "$(jq -r '.attributeMapping["attribute.repository_owner_id"] // empty' "$verify")" = 'assertion.repository_owner_id' ]]
          [[ "$(jq -r '.attributeMapping["attribute.repository_owner"] // empty' "$verify")" = 'assertion.repository_owner' ]]
          [[ "$(jq -r '.attributeMapping["attribute.repository"] // empty' "$verify")" = 'assertion.repository' ]]

      - name: Verify the pool has only the locked GitHub provider
        id: pool-check
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          url='https://iam.googleapis.com/v1/projects/1058001477767/locations/global/workloadIdentityPools/github/providers'
          body=$(mktemp)
          curl -fsS -H "Authorization: Bearer $TOKEN" "$url" > "$body"
          jq '{providers:[.workloadIdentityPoolProviders[]? | {name,state,attributeCondition}]}' "$body"
          count=$(jq '[.workloadIdentityPoolProviders[]? | select(.state != "DELETED")] | length' "$body")
          only=$(jq -r '[.workloadIdentityPoolProviders[]? | select(.state != "DELETED")][0].name // empty' "$body")
          [[ "$count" = 1 ]]
          [[ "$only" = 'projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions' ]]
          echo 'single_provider=true' >> "$GITHUB_OUTPUT"

      - name: Grant the locked GitHub pool Workload Identity User
        if: steps.pool-check.outputs.single_provider == 'true'
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          sa="$GOOGLE_SERVICE_ACCOUNT"
          get_url="https://iam.googleapis.com/v1/projects/-/serviceAccounts/$sa:getIamPolicy"
          set_url="https://iam.googleapis.com/v1/projects/-/serviceAccounts/$sa:setIamPolicy"
          owner_member="principalSet://iam.googleapis.com/projects/1058001477767/locations/global/workloadIdentityPools/github/attribute.repository_owner_id/$OWNER_ID"
          pool_member='principalSet://iam.googleapis.com/projects/1058001477767/locations/global/workloadIdentityPools/github/*'

          current=$(mktemp)
          status=$(curl -sS -o "$current" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"options":{"requestedPolicyVersion":3}}' "$get_url")
          echo "getIamPolicy HTTP $status"
          [[ "$status" = 200 ]]

          updated=$(mktemp)
          jq --arg owner_member "$owner_member" --arg pool_member "$pool_member" '
            if any(.bindings[]?; .role == "roles/iam.workloadIdentityUser") then
              .bindings |= map(
                if .role == "roles/iam.workloadIdentityUser" then
                  .members = ((.members + [$owner_member, $pool_member]) | unique)
                else . end
              )
            else
              .bindings += [{"role":"roles/iam.workloadIdentityUser","members":[$owner_member,$pool_member]}]
            end
          ' "$current" > "$updated"

          payload=$(mktemp)
          jq -n --slurpfile policy "$updated" '{policy:$policy[0]}' > "$payload"
          body=$(mktemp)
          status=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data-binary "@$payload" "$set_url")
          echo "setIamPolicy HTTP $status"
          if [[ "$status" != 200 ]]; then
            cat "$body" >&2
            exit 1
          fi

          verify=$(mktemp)
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"options":{"requestedPolicyVersion":3}}' "$get_url" > "$verify"
          jq -e --arg member "$pool_member" 'any(.bindings[]?; .role == "roles/iam.workloadIdentityUser" and (.members // [] | index($member) != null))' "$verify" >/dev/null
          echo "Verified Workload Identity User member: $pool_member"
