name: Configure Kamilunavo WIF trust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-wif-update-permission.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  WIF_PROVIDER: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
  GOOGLE_SERVICE_ACCOUNT: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Allow every repository owned by acciento89-bot
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          url='https://iam.googleapis.com/v1/projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions'
          condition="assertion.repository_owner == 'acciento89-bot' && assertion.repository_owner_id == '309368001'"
          payload=$(jq -n --arg condition "$condition" '{attributeCondition:$condition}')
          body=$(mktemp)
          status=$(curl -sS -o "$body" -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data "$payload" "$url?updateMask=attributeCondition")
          echo "PATCH HTTP $status"
          cat "$body" | jq . || cat "$body"
          [[ "$status" = 200 ]]

          operation=$(jq -r '.name // empty' "$body")
          if [[ "$operation" == *'/operations/'* ]]; then
            operation_url="https://iam.googleapis.com/v1/$operation"
            for i in $(seq 1 30); do
              op=$(mktemp)
              curl -fsS -H "Authorization: Bearer $TOKEN" "$operation_url" > "$op"
              if [[ "$(jq -r '.done // false' "$op")" = true ]]; then
                if jq -e '.error' "$op" >/dev/null; then
                  cat "$op" >&2
                  exit 1
                fi
                break
              fi
              sleep 2
            done
          fi

          verify=$(mktemp)
          curl -fsS -H "Authorization: Bearer $TOKEN" "$url" > "$verify"
          actual=$(jq -r '.attributeCondition' "$verify")
          echo "Verified provider condition: $actual"
          [[ "$actual" = "$condition" ]]
      - name: Inspect service-account Workload Identity binding
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          sa='navoops@emerald-caster-508318-f2.iam.gserviceaccount.com'
          url="https://iam.googleapis.com/v1/projects/-/serviceAccounts/$sa:getIamPolicy"
          body=$(mktemp)
          status=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"options":{"requestedPolicyVersion":3}}' "$url")
          echo "IAM policy HTTP $status"
          if [[ "$status" = 200 ]]; then
            jq '{version,bindings:[.bindings[]? | select(.role=="roles/iam.workloadIdentityUser" or .role=="roles/iam.serviceAccountTokenCreator") | {role,members,condition}]}' "$body"
          else
            cat "$body"
          fi
