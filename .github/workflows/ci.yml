name: MängelFix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Server-Syntax prüfen
        run: node --check server/index.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Server authentication code checks (no purchases)
        working-directory: server
        env:
          MAENGELFIX_ISOLATED_POSTGRES: postgresql://postgres:isolated-ci-only@localhost:5432/postgres
        run: npm ci --no-audit --no-fund && npm test

      - name: Client-Abhängigkeiten installieren
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Frontend bauen
        working-directory: client
        run: npm run build

      - name: Docker-Image bauen
        run: docker build -t maengelfix:ci .
