name: Repair Play icons with release credential

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-play-icons-with-key.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SA_B64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64 }}
    steps:
      - uses: actions/checkout@v5
      - name: Check credential availability
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SA_B64:-}" ]; then
            echo 'GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64 is not configured in GitHub Actions.' >&2
            exit 78
          fi
          printf '%s' "$SA_B64" | base64 --decode > "$RUNNER_TEMP/play-sa.json"
          chmod 600 "$RUNNER_TEMP/play-sa.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'play-sa.json')
          data=json.load(open(p))
          assert data.get('type') == 'service_account'
          assert data.get('client_email')
          print('Service-account credential decoded successfully.')
          PY
      - name: Install Google auth
        run: python3 -m pip install --disable-pip-version-check -q google-auth requests
      - name: Repair Kintaroq and RohrCalc listing icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, sys
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          root=os.environ['GITHUB_WORKSPACE']
          key=os.path.join(os.environ['RUNNER_TEMP'],'play-sa.json')
          creds=service_account.Credentials.from_service_account_file(
              key, scopes=['https://www.googleapis.com/auth/androidpublisher'])
          creds.refresh(Request())
          headers={'Authorization': f'Bearer {creds.token}'}
          api='https://androidpublisher.googleapis.com/androidpublisher/v3'
          upload='https://androidpublisher.googleapis.com/upload/androidpublisher/v3'

          targets=[
              ('com.kamilunavo.kintaroq', os.path.join(root,'generated/navoops/play-icon-fixes/kintaroq-512.png')),
              ('de.kamilunavo.rohrcalc', os.path.join(root,'generated/navoops/play-icon-fixes/rohrcalc-512.png')),
          ]

          for package, icon in targets:
              expected=hashlib.sha256(open(icon,'rb').read()).hexdigest()
              r=requests.post(f'{api}/applications/{package}/edits', headers={**headers,'Content-Type':'application/json'}, json={}, timeout=30)
              r.raise_for_status()
              edit=r.json()['id']
              try:
                  r=requests.get(f'{api}/applications/{package}/edits/{edit}/listings', headers=headers, timeout=30)
                  r.raise_for_status()
                  langs=[x['language'] for x in r.json().get('listings',[])]
                  if not langs:
                      raise RuntimeError(f'{package}: no listings returned')
                  for lang in langs:
                      with open(icon,'rb') as fh:
                          r=requests.post(
                              f'{upload}/applications/{package}/edits/{edit}/listings/{lang}/icon?uploadType=media',
                              headers={**headers,'Content-Type':'image/png'}, data=fh, timeout=60)
                      r.raise_for_status()
                      actual=r.json().get('image',{}).get('sha256')
                      print(f'{package}/{lang}: staged sha256={actual}')
                      if actual != expected:
                          raise RuntimeError(f'{package}/{lang}: uploaded icon checksum mismatch')
                  r=requests.post(
                      f'{api}/applications/{package}/edits/{edit}:commit',
                      headers={**headers,'Content-Type':'application/json'}, json={}, timeout=30)
                  if not r.ok:
                      print(f'{package}: commit failed HTTP {r.status_code}: {r.text}', file=sys.stderr)
                      r.raise_for_status()
                  print(f'{package}: committed listing icon edit')
              except Exception:
                  try:
                      requests.delete(f'{api}/applications/{package}/edits/{edit}', headers=headers, timeout=15)
                  except Exception:
                      pass
                  raise
          PY
