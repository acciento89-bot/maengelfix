name: NavoOps Google Vitals Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/navoops-google-vitals-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  WIF_PROVIDER: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
  GOOGLE_SERVICE_ACCOUNT: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google with GitHub OIDC
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/playdeveloperreporting

      - name: Probe Play Developer Reporting
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            name="$1"
            url="$2"
            body="$(mktemp)"
            code=$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'Accept: application/json' "$url")
            echo "=== $name HTTP $code ==="
            cat "$body"
            echo
            rm -f "$body"
          }
          BASE='https://playdeveloperreporting.googleapis.com/v1beta1'
          probe 'apps.search' "$BASE/apps:search?pageSize=1000"
          probe 'NavoKids crash metadata' "$BASE/apps/com.kamilunavo.navokids/crashRateMetricSet"
          probe 'NavoKids ANR metadata' "$BASE/apps/com.kamilunavo.navokids/anrRateMetricSet"
          probe 'MängelFix crash metadata' "$BASE/apps/com.kamilunavo.maengelfix/crashRateMetricSet"
          probe 'MängelFix ANR metadata' "$BASE/apps/com.kamilunavo.maengelfix/anrRateMetricSet"
