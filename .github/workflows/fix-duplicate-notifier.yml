name: Fix duplicate notifier
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-duplicate-notifier.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/fix_duplicate_notification_helper.py
      - run: node --check server/index.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js
          if git diff --cached --quiet; then echo "Nothing to commit"; else git commit -m "Separate organization in-app and email notifications" && git pull --rebase origin main && git push; fi
