name: MängelFix Apple Billing Upgrade
on:
  push:
    branches: [ios-app]
    paths:
      - .github/workflows/upgrade-v020-apple-billing.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/upgrade_v020_apple_billing.py
      - run: node --check server/index.js
      - run: |
          cd server
          npm install --no-package-lock --no-audit --no-fund
          node -e "import('@apple/app-store-server-library').then(()=>console.log('Apple server library OK'))"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js server/package.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add Apple App Store subscription backend"
            git push
          fi
