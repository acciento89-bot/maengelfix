name: MängelFix v0.10 Account + Billing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v010-account-billing.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply account and privacy upgrade
        run: python3 scripts/upgrade_v010_account_security.py
      - name: Apply billing foundation
        run: python3 scripts/upgrade_v010_billing.py
      - name: Commit generated v0.10 runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/schema.sql server/index.js server/package.json client/src/App.jsx client/src/maengelfix-pro.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Build MängelFix v0.10 account privacy trials and billing foundation"
            git push
          fi
