name: MängelFix v0.18 Context Categories
on:
  push:
    branches: [main]
    paths: ['.github/workflows/upgrade-v018.yml']
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/upgrade_v018_context_categories.py
      - run: node --check server/index.js
      - run: |
          cd client
          npm install
          npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js server/package.json client/src/App.jsx
          if git diff --cached --quiet; then echo "Nothing to commit"; else git commit -m "Build MängelFix v0.18 context-aware defect categories" && git push; fi
