name: MängelFix v0.21 Account Modes v2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-v021-account-modes-v2.yml
      - scripts/run_v021_account_modes.py
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/run_v021_account_modes.py
      - run: node --check server/index.js
      - run: |
          cd client
          npm install --no-audit --no-fund
          npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/schema.sql server/index.js server/package.json client/src/App.jsx client/src/maengelfix-pro.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Build v0.21 separate private and management accounts"
            git push
          fi
