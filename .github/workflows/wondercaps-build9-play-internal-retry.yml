name: WonderCaps Build 9 internal Play retry

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: wondercaps-build9-google-play
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.kamilunavo.wunderkapseln
  VERSION_CODE: '9'
  VERSION_NAME: 0.5.0
  SOURCE_RUN_ID: '35054060301'
  SOURCE_ARTIFACT_ID: '10430291962'
  SOURCE_ARTIFACT_DIGEST: sha256:6e66dddb89c84f453d3ef249b92ba4233178d7ee441f792b6998f6fc1872fa22
  WIF_PROVIDER: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
  GOOGLE_SERVICE_ACCOUNT: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com
  CENTRAL_SHA1: BCF2337D41E617C03BCAE698C09D1523654BD790
  CENTRAL_SHA256: 7985BD6B33711BACA7E6BA722C2B3870EBBC802F7DB4A7BC1206BDAE51C4D5D6
  BUNDLETOOL_URL: https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
  BUNDLETOOL_SHA256: 378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584

jobs:
  publish-internal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify immutable signed artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS "${headers[@]}" "$api/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          jq -e --argjson run "$SOURCE_RUN_ID" '.id==$run and .status=="completed" and .conclusion=="failure" and .head_sha=="77ea3e5245f173dc0a9c70ebd01d9fd9d974c95e"' "$RUNNER_TEMP/source-run.json" >/dev/null
          curl -fsS "${headers[@]}" "$api/actions/artifacts/$SOURCE_ARTIFACT_ID" > "$RUNNER_TEMP/source-artifact.json"
          jq -e --arg digest "$SOURCE_ARTIFACT_DIGEST" --argjson run "$SOURCE_RUN_ID" --argjson artifact "$SOURCE_ARTIFACT_ID" '.id==$artifact and .expired==false and .digest==$digest and .workflow_run.id==$run' "$RUNNER_TEMP/source-artifact.json" >/dev/null

      - name: Download exact signed AAB evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.SOURCE_ARTIFACT_ID }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: signed

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reverify AAB identity and central certificate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$BUNDLETOOL_URL" -o "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' "$BUNDLETOOL_SHA256" "$RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict
          AAB="$(find signed -type f -name '*.aab' -print -quit)"
          test -s "$AAB"
          expected_aab_sha256="$(awk '{print $1}' "$AAB.sha256")"
          printf '%s  %s\n' "$expected_aab_sha256" "$AAB" | sha256sum --check --strict
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/jarsigner.txt"
          grep -Fq 'jar verified.' "$RUNNER_TEMP/jarsigner.txt"
          keytool -J-Duser.language=en -printcert -jarfile "$AAB" > "$RUNNER_TEMP/certificate.txt"
          actual_sha1="$(sed -n 's/^[[:space:]]*SHA1: //p' "$RUNNER_TEMP/certificate.txt" | tr -d ':\r\n ')"
          actual_sha256="$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/certificate.txt" | tr -d ':\r\n ')"
          test "$actual_sha1" = "$CENTRAL_SHA1"
          test "$actual_sha256" = "$CENTRAL_SHA256"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$AAB"
          test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" --xpath=/manifest/@package)" = "$PACKAGE_NAME"
          test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" --xpath=/manifest/@android:versionCode)" = "$VERSION_CODE"
          test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" --xpath=/manifest/@android:versionName)" = "$VERSION_NAME"
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"

      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload or reuse version 9 and publish internal track only
        env:
          TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://androidpublisher.googleapis.com/androidpublisher/v3'
          upload='https://androidpublisher.googleapis.com/upload/androidpublisher/v3'
          auth=(-H "Authorization: Bearer $TOKEN")
          json=(-H 'Content-Type: application/json')
          edit="$(curl -fsS -X POST "${auth[@]}" "${json[@]}" -d '{}' "$api/applications/$PACKAGE_NAME/edits" | jq -er '.id')"
          cleanup() { curl -fsS -X DELETE "${auth[@]}" "$api/applications/$PACKAGE_NAME/edits/$edit" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          bundles="$(curl -fsS "${auth[@]}" "$api/applications/$PACKAGE_NAME/edits/$edit/bundles")"
          if jq -e --argjson code "$VERSION_CODE" '(.bundles // []) | any(.versionCode == $code)' <<<"$bundles" >/dev/null; then
            echo "Reusing existing versionCode $VERSION_CODE"
          else
            response="$RUNNER_TEMP/upload.json"
            status="$(curl -sS -o "$response" -w '%{http_code}' -X POST "${auth[@]}" -H 'Content-Type: application/octet-stream' --data-binary "@$AAB_PATH" "$upload/applications/$PACKAGE_NAME/edits/$edit/bundles?uploadType=media")"
            test "$status" = 200 || { cat "$response" >&2; exit 1; }
            test "$(jq -r '.versionCode' "$response")" = "$VERSION_CODE"
          fi

          jq -n --arg code "$VERSION_CODE" --arg name "$VERSION_NAME ($VERSION_CODE)" '{
            track:"internal",
            releases:[{
              name:$name,
              versionCodes:[$code],
              status:"completed",
              releaseNotes:[
                {language:"en-US",text:"WonderCaps Build 9: native store purchases and release hardening."},
                {language:"de-DE",text:"WonderCaps Build 9: native Store-Käufe und technische Release-Absicherung."}
              ]
            }]
          }' > "$RUNNER_TEMP/internal.json"
          curl -fsS -X PUT "${auth[@]}" "${json[@]}" --data-binary "@$RUNNER_TEMP/internal.json" "$api/applications/$PACKAGE_NAME/edits/$edit/tracks/internal" > "$RUNNER_TEMP/internal-result.json"
          jq -e --arg code "$VERSION_CODE" '.track=="internal" and (.releases | any(.status=="completed" and (.versionCodes | index($code))))' "$RUNNER_TEMP/internal-result.json" >/dev/null

          commit="$RUNNER_TEMP/commit.json"
          status="$(curl -sS -o "$commit" -w '%{http_code}' -X POST "${auth[@]}" "${json[@]}" -d '{}' "$api/applications/$PACKAGE_NAME/edits/$edit:commit")"
          [[ "$status" == 2* ]] || { cat "$commit" >&2; exit 1; }
          trap - EXIT

          verify="$(curl -fsS -X POST "${auth[@]}" "${json[@]}" -d '{}' "$api/applications/$PACKAGE_NAME/edits" | jq -er '.id')"
          verify_cleanup() { curl -fsS -X DELETE "${auth[@]}" "$api/applications/$PACKAGE_NAME/edits/$verify" >/dev/null 2>&1 || true; }
          trap verify_cleanup EXIT
          curl -fsS "${auth[@]}" "$api/applications/$PACKAGE_NAME/edits/$verify/tracks/internal" > internal-track.json
          jq -e --arg code "$VERSION_CODE" '.releases | any(.status=="completed" and (.versionCodes | index($code)))' internal-track.json >/dev/null
          curl -fsS "${auth[@]}" "$api/applications/$PACKAGE_NAME/edits/$verify/bundles" | jq -e --argjson code "$VERSION_CODE" '(.bundles // []) | any(.versionCode==$code)' >/dev/null
          echo "Build 9 is published to the internal track. Production was not modified." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wondercaps-build9-internal-play-verification
          path: internal-track.json
          if-no-files-found: error
          retention-days: 30
