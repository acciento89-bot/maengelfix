name: Probe GCP Secret Manager

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-gcp-secret-manager.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  WIF_PROVIDER: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
  GOOGLE_SERVICE_ACCOUNT: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Check Secret Manager metadata access only
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" 'https://secretmanager.googleapis.com/v1/projects/emerald-caster-508318-f2/secrets?pageSize=1')
          echo "secret-manager-list-http=$code"
          if [[ "$code" = 2* ]]; then
            echo 'Secret Manager metadata access is available.'
          else
            jq -r '.error.status // .error.message // "unknown"' /tmp/resp.json
          fi
