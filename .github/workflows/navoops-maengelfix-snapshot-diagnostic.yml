{
  "name": "M9 bounded snapshot diagnostic (manual, owned edit only)",
  "run-name": "M9 fixed snapshot diagnostic ${{ github.run_id }}",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "scoped-business-production-submit",
    "cancel-in-progress": false
  },
  "env": {
    "WIF_PROVIDER": "projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions",
    "GOOGLE_SERVICE_ACCOUNT": "navoops@emerald-caster-508318-f2.iam.gserviceaccount.com",
    "DIAGNOSTIC_SCRIPT_SHA256": "31176c7b836020b904b53442c9420e5a9183df9f2309a78c8b93668aaaf65947",
    "CATALOG_SHA256": "ff7cf7b296c1fd84f758d26fc0cb27d546fbf997c41540ca697bcecf1270a958",
    "SOURCE_MANIFEST_SHA256": "2bf664da1574d2e4291ed274a0e2cb562f7a5cb48c076e33b542f6fe8c4a8908",
    "PYTHONDONTWRITEBYTECODE": "1"
  },
  "jobs": {
    "diagnose": {
      "if": "github.repository == 'acciento89-bot/maengelfix' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "read",
        "id-token": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@v5",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Check exact diagnostic and pinned M catalog before identity access",
          "shell": "bash",
          "run": "set -euo pipefail\nprintf '%s  %s\\n' \"$DIAGNOSTIC_SCRIPT_SHA256\" .github/scoped-business-submit/diagnose_maengelfix_snapshot.py | sha256sum --check --strict\nprintf '%s  %s\\n' \"$CATALOG_SHA256\" .github/scoped-business-submit/business-catalog.json | sha256sum --check --strict\nprintf '%s  %s\\n' \"$SOURCE_MANIFEST_SHA256\" .github/scoped-business-submit/business-source-manifest.json | sha256sum --check --strict\npython3 -B -m unittest discover -s .github/scoped-business-submit/tests -p test_maengelfix_snapshot_diagnostic.py -v\n"
        },
        {
          "id": "google-auth",
          "uses": "google-github-actions/auth@v3",
          "with": {
            "workload_identity_provider": "${{ env.WIF_PROVIDER }}",
            "service_account": "${{ env.GOOGLE_SERVICE_ACCOUNT }}",
            "token_format": "access_token",
            "access_token_scopes": "https://www.googleapis.com/auth/androidpublisher"
          }
        },
        {
          "name": "One owned edit, fixed ten reads, finally owned DELETE204",
          "env": {
            "TOKEN": "${{ steps.google-auth.outputs.access_token }}"
          },
          "shell": "bash",
          "run": "set -euo pipefail\npython3 -B .github/scoped-business-submit/diagnose_maengelfix_snapshot.py diagnose-once --report \"$RUNNER_TEMP/maengelfix-snapshot-diagnostic/report.json\"\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "maengelfix-snapshot-diagnostic-${{ github.run_id }}",
            "path": "${{ runner.temp }}/maengelfix-snapshot-diagnostic/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
