name: NavoOps Google Play Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '32 * * * *'
  push:
    branches:
      - main
      - feature/navoops-google-store-feed
    paths:
      - '.github/workflows/navoops-google-store-feed.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: navoops-google-store-feed-${{ github.ref }}
  cancel-in-progress: false

env:
  FEED_PATH: generated/navoops/google-store-status.json
  WIF_PROVIDER: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
  GOOGLE_SERVICE_ACCOUNT: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bridge repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud with GitHub OIDC
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Collect Google Play state
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FEED_PATH")"
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          test -n "${GOOGLE_ACCESS_TOKEN:-}"

          FEED_PATH="$FEED_PATH" GENERATED_AT="$NOW" GOOGLE_ACCESS_TOKEN="$GOOGLE_ACCESS_TOKEN" node <<'NODE'
          const fs = require('fs');

          const generatedAt = process.env.GENERATED_AT;
          const feedPath = process.env.FEED_PATH;
          const token = process.env.GOOGLE_ACCESS_TOKEN;
          const packages = [
            ['NavoKids', 'com.kamilunavo.navokids'],
            ['ZweiCheck', 'de.kamilunavo.zweicheck'],
            ['ArbeitsKlar', 'de.kamilunavo.arbeitsklar'],
            ['WärmeTakt', 'de.kamilunavo.waermetakt'],
            ['Reklaio', 'de.kamilunavo.reklaio'],
            ['MängelFix', 'com.kamilunavo.maengelfix'],
            ['Kintaroq', 'com.kamilunavo.kintaroq'],
            ['NavoPass', 'de.kamilunavo.navopass'],
            ['99,9 %', 'de.kamilunavo.ninenine'],
            ['NavoTap', 'com.kamilunavo.onemoretap'],
            ['KälteCalc', 'de.kamilunav.kaltecalc'],
            ['LüftungsCalc', 'de.kamilunavo.luftungscalc'],
            ['HeizkörperCalc', 'de.kamilunavo.heizkorpercalc'],
            ['RohrCalc', 'de.kamilunavo.rohrcalc'],
            ['AnlagenCheck', 'de.kamilunavo.servicecheck'],
            ['VolumeCalc', 'de.kamilunavo.volumecalc'],
            ['KeepMeter', 'de.kamilunavo.keepmeter'],
            ['Schon erledigt?', 'com.kamilunavo.schonerledigt'],
            ['BrennerCalc', 'de.kamilunavo.brennercalc'],
            ['HydroCalc', 'de.kamilunavo.hydrocalc'],
            ['MAGCalc', 'de.kamilunavo.magcalc']
          ];

          const trackCandidates = ['production', 'internal', 'beta', 'qa', 'alpha'];

          async function api(url) {
            return fetch(url, {
              headers: {
                authorization: `Bearer ${token}`,
                accept: 'application/json'
              }
            });
          }

          function maxVersionCode(release) {
            const codes = (release?.activeArtifacts || [])
              .map(item => Number(item.versionCode))
              .filter(Number.isFinite);
            return codes.length ? Math.max(...codes) : null;
          }

          function stateFor(track, lifecycle) {
            switch (lifecycle) {
              case 'RELEASE_LIFECYCLE_STATE_DRAFT':
                return 'development';
              case 'RELEASE_LIFECYCLE_STATE_NOT_SENT_FOR_REVIEW':
              case 'RELEASE_LIFECYCLE_STATE_APPROVED_NOT_PUBLISHED':
                return 'attention';
              case 'RELEASE_LIFECYCLE_STATE_IN_REVIEW':
                return 'review';
              case 'RELEASE_LIFECYCLE_STATE_NOT_APPROVED':
                return 'rejected';
              case 'RELEASE_LIFECYCLE_STATE_PUBLISHED':
                return track === 'production' ? 'live' : 'internalTest';
              default:
                return 'processing';
            }
          }

          function lifecyclePriority(lifecycle) {
            switch (lifecycle) {
              case 'RELEASE_LIFECYCLE_STATE_NOT_APPROVED': return 70;
              case 'RELEASE_LIFECYCLE_STATE_APPROVED_NOT_PUBLISHED': return 60;
              case 'RELEASE_LIFECYCLE_STATE_NOT_SENT_FOR_REVIEW': return 55;
              case 'RELEASE_LIFECYCLE_STATE_IN_REVIEW': return 50;
              case 'RELEASE_LIFECYCLE_STATE_DRAFT': return 40;
              case 'RELEASE_LIFECYCLE_STATE_PUBLISHED': return 20;
              default: return 10;
            }
          }

          function chooseRelease(releases) {
            if (!releases.length) return null;
            return [...releases].sort((a, b) => {
              const priority = lifecyclePriority(b.releaseLifecycleState) - lifecyclePriority(a.releaseLifecycleState);
              if (priority !== 0) return priority;
              const build = (maxVersionCode(b) || 0) - (maxVersionCode(a) || 0);
              if (build !== 0) return build;
              if (a.track === 'production' && b.track !== 'production') return -1;
              if (b.track === 'production' && a.track !== 'production') return 1;
              return 0;
            })[0];
          }

          function choosePublicProductionRelease(releases) {
            const published = releases.filter(release =>
              release.track === 'production' &&
              release.releaseLifecycleState === 'RELEASE_LIFECYCLE_STATE_PUBLISHED'
            );
            if (!published.length) return null;
            return [...published].sort((a, b) => (maxVersionCode(b) || 0) - (maxVersionCode(a) || 0))[0];
          }

          function readableLifecycle(lifecycle) {
            return {
              RELEASE_LIFECYCLE_STATE_DRAFT: 'Draft',
              RELEASE_LIFECYCLE_STATE_NOT_SENT_FOR_REVIEW: 'Ready for review · developer action required',
              RELEASE_LIFECYCLE_STATE_IN_REVIEW: 'In review',
              RELEASE_LIFECYCLE_STATE_APPROVED_NOT_PUBLISHED: 'Approved · manual publish required',
              RELEASE_LIFECYCLE_STATE_NOT_APPROVED: 'Rejected in review · reason available only in Play Console',
              RELEASE_LIFECYCLE_STATE_PUBLISHED: 'Published'
            }[lifecycle] || lifecycle;
          }

          function detailFor(track, lifecycle) {
            return `${track} · ${readableLifecycle(lifecycle)}`;
          }

          function reviewFor(track, lifecycle) {
            return {
              submissionID: null,
              submissionState: null,
              itemStates: [],
              submittedAt: null,
              track,
              lifecycleState: lifecycle,
              reason: null,
              reasonAvailability: 'consoleOnly',
              consoleURL: 'https://play.google.com/console'
            };
          }

          (async () => {
            const apps = [];
            let accessible = 0;

            for (const [appName, packageName] of packages) {
              const releases = [];
              let appAccessible = false;

              for (const track of trackCandidates) {
                const parent = `applications/${packageName}/tracks/${track}`;
                const url = `https://androidpublisher.googleapis.com/androidpublisher/v3/${parent}/releases`;
                const response = await api(url);
                if (!response.ok) {
                  if (response.status !== 404) {
                    console.log(`${packageName}/${track}: unavailable (${response.status})`);
                  }
                  continue;
                }

                appAccessible = true;
                const payload = await response.json().catch(() => ({}));
                for (const release of payload.releases || []) {
                  releases.push({...release, track: release.track || track});
                }
              }

              if (!appAccessible) {
                console.log(`${packageName}: no readable Google Play track`);
                continue;
              }

              accessible += 1;
              const selectedRelease = chooseRelease(releases);
              const publicRelease = choosePublicProductionRelease(releases);
              const publiclyAvailable = Boolean(publicRelease);

              if (!selectedRelease) {
                apps.push({
                  provider: 'google',
                  appName,
                  externalID: packageName,
                  bundleOrPackageID: packageName,
                  version: null,
                  build: null,
                  rawState: 'none',
                  state: 'development',
                  publiclyAvailable: false,
                  publicBuild: null,
                  updateState: 'development',
                  updateRawState: 'none',
                  updatedAt: generatedAt,
                  detail: 'No active release found on configured Google Play tracks.',
                  review: null,
                  tracks: []
                });
                continue;
              }

              const lifecycle = String(selectedRelease.releaseLifecycleState || 'RELEASE_LIFECYCLE_STATE_UNSPECIFIED');
              const track = String(selectedRelease.track || 'unknown');
              const updateRawState = `${track}:${lifecycle}`;
              const updateState = stateFor(track, lifecycle);
              const build = maxVersionCode(selectedRelease);
              const publicBuild = publicRelease ? maxVersionCode(publicRelease) : null;
              const state = publiclyAvailable ? 'live' : updateState;
              const detail = publiclyAvailable && updateState !== 'live'
                ? `Production published${publicBuild == null ? '' : ` · build ${publicBuild}`} · pending/current update: ${detailFor(track, lifecycle)}`
                : detailFor(track, lifecycle);
              const trackSnapshots = releases.map(release => ({
                track: String(release.track || 'unknown'),
                lifecycleState: String(release.releaseLifecycleState || 'RELEASE_LIFECYCLE_STATE_UNSPECIFIED'),
                releaseName: release.releaseName || null,
                build: maxVersionCode(release)
              })).sort((a, b) => {
                if (a.track === 'production' && b.track !== 'production') return -1;
                if (b.track === 'production' && a.track !== 'production') return 1;
                return (b.build || 0) - (a.build || 0);
              });

              apps.push({
                provider: 'google',
                appName,
                externalID: packageName,
                bundleOrPackageID: packageName,
                version: selectedRelease.releaseName || null,
                build: build == null ? null : String(build),
                rawState: publiclyAvailable ? `production:RELEASE_LIFECYCLE_STATE_PUBLISHED` : updateRawState,
                state,
                publiclyAvailable,
                publicBuild: publicBuild == null ? null : String(publicBuild),
                updateState,
                updateRawState,
                updatedAt: generatedAt,
                detail,
                review: reviewFor(track, lifecycle),
                tracks: trackSnapshots
              });
            }

            fs.writeFileSync(feedPath, JSON.stringify({
              schemaVersion: 3,
              generatedAt,
              sourceRepository: process.env.GITHUB_REPOSITORY || 'acciento89-bot/maengelfix',
              appleAvailable: false,
              googleAvailable: accessible > 0,
              summary: {
                readableApps: accessible,
                publiclyAvailable: apps.filter(app => app.publiclyAvailable).length,
                pendingReviewWithoutPublicProduction: apps.filter(app => !app.publiclyAvailable && app.updateState === 'review').length
              },
              apps
            }, null, 2) + '\n');
            console.log(`Google Play apps readable: ${accessible}; snapshots: ${apps.length}`);
            console.log(`Public production apps: ${apps.filter(app => app.publiclyAvailable).length}`);
            console.log(`Google Play review records: ${apps.filter(app => app.review).length}`);
          })().catch(error => {
            console.error(error.stack || error.message || error);
            process.exit(1);
          });
          NODE

          jq empty "$FEED_PATH"

      - name: Commit refreshed feed
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="$RUNNER_TEMP/google-store-status.json"
          cp "$FEED_PATH" "$SNAPSHOT"
          git config user.name 'kamilunavo-ops-bot'
          git config user.email 'actions@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            mkdir -p "$(dirname "$FEED_PATH")"
            cp "$SNAPSHOT" "$FEED_PATH"
            git add "$FEED_PATH"

            if git diff --cached --quiet; then
              echo 'Google store feed unchanged.'
              exit 0
            fi

            git commit -m 'chore: refresh NavoOps Google Play feed'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "Push raced with another feed update; retrying ($attempt/3)."
            sleep $((attempt * 2))
          done

          echo 'Unable to publish Google store feed after retries.' >&2
          exit 1
