name: NavoOps Google Play Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '32 * * * *'
  push:
    branches:
      - main
      - feature/navoops-google-store-feed
    paths:
      - '.github/workflows/navoops-google-store-feed.yml'

permissions:
  contents: write

concurrency:
  group: navoops-google-store-feed-${{ github.ref }}
  cancel-in-progress: false

env:
  FEED_PATH: generated/navoops/google-store-status.json

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bridge repository
        uses: actions/checkout@v5

      - name: Collect Google Play state
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FEED_PATH")"
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          if [[ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64:-}" ]]; then
            jq -n \
              --arg generatedAt "$NOW" \
              --arg sourceRepository "$GITHUB_REPOSITORY" \
              '{schemaVersion:1,generatedAt:$generatedAt,sourceRepository:$sourceRepository,appleAvailable:false,googleAvailable:false,apps:[]}' \
              > "$FEED_PATH"
            echo 'Google Play service-account secret is not configured in this bridge repository.'
            exit 0
          fi

          KEY_JSON="$RUNNER_TEMP/google-play-service-account.json"
          if ! printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64" | base64 --decode > "$KEY_JSON" 2>/dev/null; then
            printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_B64" > "$KEY_JSON"
          fi
          jq -e '.client_email and .private_key' "$KEY_JSON" >/dev/null

          GOOGLE_KEY_JSON="$KEY_JSON" FEED_PATH="$FEED_PATH" GENERATED_AT="$NOW" node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const service = JSON.parse(fs.readFileSync(process.env.GOOGLE_KEY_JSON, 'utf8'));
          const generatedAt = process.env.GENERATED_AT;
          const feedPath = process.env.FEED_PATH;
          const packages = [
            ['NavoKids', 'com.kamilunavo.navokids'],
            ['ZweiCheck', 'de.kamilunavo.zweicheck'],
            ['ArbeitsKlar', 'de.kamilunavo.arbeitsklar'],
            ['WärmeTakt', 'de.kamilunavo.waermetakt'],
            ['Reklaio', 'de.kamilunavo.reklaio'],
            ['MängelFix', 'com.kamilunavo.maengelfix'],
            ['Kintaroq', 'com.kamilunavo.kintaroq'],
            ['NavoPass', 'de.kamilunavo.navopass'],
            ['99,9 %', 'de.kamilunavo.ninenine'],
            ['KälteCalc', 'de.kamilunav.kaltecalc'],
            ['LüftungsCalc', 'de.kamilunavo.luftungscalc'],
            ['HeizkörperCalc', 'de.kamilunavo.heizkorpercalc'],
            ['RohrCalc', 'de.kamilunavo.rohrcalc'],
            ['AnlagenCheck', 'de.kamilunavo.servicecheck'],
            ['VolumeCalc', 'de.kamilunavo.volumecalc'],
            ['KeepMeter', 'de.kamilunavo.keepmeter'],
            ['Schon erledigt?', 'com.kamilunavo.schonerledigt'],
            ['BrennerCalc', 'de.kamilunavo.brennercalc'],
            ['HydroCalc', 'de.kamilunavo.hydrocalc'],
            ['MAGCalc', 'de.kamilunavo.magcalc']
          ];
          // Google documents these default track IDs. Closed-test tracks can have custom IDs;
          // add them here later only when a Kamilunavo app actually uses one.
          const trackCandidates = ['production', 'beta', 'qa', 'alpha'];

          const b64url = value => Buffer.from(JSON.stringify(value)).toString('base64url');

          async function accessToken() {
            const now = Math.floor(Date.now() / 1000);
            const tokenUri = service.token_uri || 'https://oauth2.googleapis.com/token';
            const header = b64url({alg: 'RS256', typ: 'JWT'});
            const claims = b64url({
              iss: service.client_email,
              scope: 'https://www.googleapis.com/auth/androidpublisher',
              aud: tokenUri,
              iat: now,
              exp: now + 3600
            });
            const input = `${header}.${claims}`;
            const signature = crypto.sign('RSA-SHA256', Buffer.from(input), service.private_key).toString('base64url');
            const assertion = `${input}.${signature}`;
            const response = await fetch(tokenUri, {
              method: 'POST',
              headers: {'content-type': 'application/x-www-form-urlencoded'},
              body: new URLSearchParams({grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion})
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload.access_token) {
              throw new Error(`Google OAuth failed (${response.status}).`);
            }
            return payload.access_token;
          }

          async function api(token, url) {
            return fetch(url, {
              headers: {
                authorization: `Bearer ${token}`,
                accept: 'application/json'
              }
            });
          }

          function maxVersionCode(release) {
            const codes = (release?.activeArtifacts || [])
              .map(item => Number(item.versionCode))
              .filter(Number.isFinite);
            return codes.length ? Math.max(...codes) : null;
          }

          function stateFor(track, lifecycle) {
            switch (lifecycle) {
              case 'RELEASE_LIFECYCLE_STATE_DRAFT':
                return 'development';
              case 'RELEASE_LIFECYCLE_STATE_NOT_SENT_FOR_REVIEW':
              case 'RELEASE_LIFECYCLE_STATE_APPROVED_NOT_PUBLISHED':
                return 'attention';
              case 'RELEASE_LIFECYCLE_STATE_IN_REVIEW':
                return 'review';
              case 'RELEASE_LIFECYCLE_STATE_NOT_APPROVED':
                return 'rejected';
              case 'RELEASE_LIFECYCLE_STATE_PUBLISHED':
                return track === 'production' ? 'live' : 'internalTest';
              default:
                return 'processing';
            }
          }

          function lifecyclePriority(lifecycle) {
            switch (lifecycle) {
              case 'RELEASE_LIFECYCLE_STATE_NOT_APPROVED': return 70;
              case 'RELEASE_LIFECYCLE_STATE_APPROVED_NOT_PUBLISHED': return 60;
              case 'RELEASE_LIFECYCLE_STATE_NOT_SENT_FOR_REVIEW': return 55;
              case 'RELEASE_LIFECYCLE_STATE_IN_REVIEW': return 50;
              case 'RELEASE_LIFECYCLE_STATE_DRAFT': return 40;
              case 'RELEASE_LIFECYCLE_STATE_PUBLISHED': return 20;
              default: return 10;
            }
          }

          function chooseRelease(releases) {
            if (!releases.length) return null;
            return [...releases].sort((a, b) => {
              const priority = lifecyclePriority(b.releaseLifecycleState) - lifecyclePriority(a.releaseLifecycleState);
              if (priority !== 0) return priority;
              const build = (maxVersionCode(b) || 0) - (maxVersionCode(a) || 0);
              if (build !== 0) return build;
              if (a.track === 'production' && b.track !== 'production') return -1;
              if (b.track === 'production' && a.track !== 'production') return 1;
              return 0;
            })[0];
          }

          (async () => {
            const token = await accessToken();
            const apps = [];
            let accessible = 0;

            for (const [appName, packageName] of packages) {
              const releases = [];
              let appAccessible = false;

              for (const track of trackCandidates) {
                const parent = `applications/${packageName}/tracks/${track}`;
                const url = `https://androidpublisher.googleapis.com/androidpublisher/v3/${parent}/releases`;
                const response = await api(token, url);
                if (!response.ok) {
                  // Missing tracks are normal. 403 across every track means the service account
                  // has not been granted access to this Play Console app.
                  if (response.status !== 404) {
                    console.log(`${packageName}/${track}: unavailable (${response.status})`);
                  }
                  continue;
                }

                appAccessible = true;
                const payload = await response.json().catch(() => ({}));
                for (const release of payload.releases || []) {
                  releases.push({...release, track: release.track || track});
                }
              }

              if (!appAccessible) {
                console.log(`${packageName}: no readable Google Play track`);
                continue;
              }

              accessible += 1;
              const release = chooseRelease(releases);
              if (!release) {
                apps.push({
                  provider: 'google',
                  appName,
                  externalID: packageName,
                  bundleOrPackageID: packageName,
                  version: null,
                  build: null,
                  rawState: 'none',
                  state: 'development',
                  updatedAt: generatedAt,
                  detail: 'No active release found on production, open, internal or alpha tracks.'
                });
                continue;
              }

              const lifecycle = String(release.releaseLifecycleState || 'RELEASE_LIFECYCLE_STATE_UNSPECIFIED');
              const track = String(release.track || 'unknown');
              const rawState = `${track}:${lifecycle}`;
              const build = maxVersionCode(release);
              apps.push({
                provider: 'google',
                appName,
                externalID: packageName,
                bundleOrPackageID: packageName,
                version: release.releaseName || null,
                build: build == null ? null : String(build),
                rawState,
                state: stateFor(track, lifecycle),
                updatedAt: generatedAt,
                detail: rawState
              });
            }

            fs.writeFileSync(feedPath, JSON.stringify({
              schemaVersion: 1,
              generatedAt,
              sourceRepository: process.env.GITHUB_REPOSITORY || 'acciento89-bot/maengelfix',
              appleAvailable: false,
              googleAvailable: accessible > 0,
              apps
            }, null, 2) + '\n');
            console.log(`Google Play apps readable: ${accessible}; snapshots: ${apps.length}`);
          })().catch(error => {
            console.error(error.stack || error.message || error);
            process.exit(1);
          });
          NODE

          jq empty "$FEED_PATH"

      - name: Commit refreshed feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kamilunavo-ops-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$FEED_PATH"
          if git diff --cached --quiet; then
            echo 'Google store feed unchanged.'
            exit 0
          fi
          git commit -m 'chore: refresh NavoOps Google Play feed'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Remove Google credential material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/google-play-service-account.json"
