name: MängelFix iOS App Review Fixes
on:
  push:
    branches: [ios-app]
    paths:
      - scripts/upgrade_ios_v041_app_review.py
      - .github/workflows/upgrade-ios-v041-app-review.yml
permissions:
  contents: write
jobs:
  upgrade-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply native App Review fixes
        run: python3 scripts/upgrade_ios_v041_app_review.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Compile iPhone and iPad app
        working-directory: ios
        run: |
          xcodebuild \
            -project MaengelFix.xcodeproj \
            -scheme MaengelFix \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Validate patch
        run: |
          grep -q 'func deleteAccount(password:' ios/Sources/Core/APIClient.swift
          grep -q 'Konto dauerhaft löschen' ios/Sources/Features/ProfileView.swift
          grep -q 'Was du mit Privat Pro bekommst' ios/Sources/Features/ProfileView.swift
          grep -q 'Nutzungsbedingungen (EULA)' ios/Sources/Features/ProfileView.swift
          grep -q 'CURRENT_PROJECT_VERSION: 8' ios/project.yml
          git diff --check
      - name: Commit native app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Sources/Core/APIClient.swift ios/Sources/Features/ProfileView.swift ios/project.yml ios/MaengelFix.xcodeproj/project.pbxproj
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix native iOS App Review requirements for build 8"
            git push
          fi
