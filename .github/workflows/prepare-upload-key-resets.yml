name: Bootstrap central Kamilunavo Android upload key

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-upload-key-resets.yml']

permissions:
  contents: write
  id-token: write

concurrency:
  group: kamilunavo-central-android-upload-key
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1058001477767/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: navoops@emerald-caster-508318-f2.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: emerald-caster-508318-f2
      - name: Refuse to regenerate an existing central identity
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if [ -s .github/signing/kamilunavo-central-upload-key.kms.json ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'Central upload identity already exists; regeneration is intentionally blocked.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Generate one central RSA-4096 upload identity and KMS-protected backup
        if: steps.existing.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/kamilunavo-central-upload"
          rm -rf "$root"
          mkdir -p "$root"
          password=$(openssl rand -base64 48 | tr -d '\n')
          echo "::add-mask::$password"
          export CENTRAL_KEY_PASSWORD="$password"
          keytool -genkeypair \
            -keystore "$root/kamilunavo-central-upload.p12" \
            -storetype PKCS12 \
            -storepass:env CENTRAL_KEY_PASSWORD \
            -keypass:env CENTRAL_KEY_PASSWORD \
            -alias kamilunavo-upload \
            -keyalg RSA -keysize 4096 -sigalg SHA256withRSA \
            -validity 9125 \
            -dname 'CN=Kamilunavo Android Upload,O=Kamilunavo,C=DE' \
            -noprompt
          mkdir -p generated/signing-central .github/signing
          keytool -exportcert -rfc \
            -keystore "$root/kamilunavo-central-upload.p12" \
            -storepass:env CENTRAL_KEY_PASSWORD \
            -alias kamilunavo-upload \
            -file generated/signing-central/kamilunavo-central-upload-certificate.pem >/dev/null
          keytool -exportcert \
            -keystore "$root/kamilunavo-central-upload.p12" \
            -storepass:env CENTRAL_KEY_PASSWORD \
            -alias kamilunavo-upload \
            -file "$root/cert.der" >/dev/null
          sha1=$(sha1sum "$root/cert.der" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          sha256=$(sha256sum "$root/cert.der" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
          cat > "$root/manifest.json" <<EOF
          {"schema":1,"id":"kamilunavo-central","keystore":"kamilunavo-central-upload.p12","alias":"kamilunavo-upload","store_password":"$password","key_password":"$password","certificate_sha1":"$sha1","certificate_sha256":"$sha256"}
          EOF
          tar -C "$root" -czf "$root/central.tar.gz" manifest.json kamilunavo-central-upload.p12
          passphrase=$(openssl rand -base64 48 | tr -d '\n')
          echo "::add-mask::$passphrase"
          printf '%s' "$passphrase" > "$root/pass.txt"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$root/central.tar.gz" -out "$root/central.enc" -pass file:"$root/pass.txt"
          openssl pkeyutl -encrypt -pubin -inkey generated/signing-bridge-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            -in "$root/pass.txt" -out "$root/pass.kms"
          gcloud kms asymmetric-decrypt \
            --project emerald-caster-508318-f2 \
            --location global \
            --keyring kamilunavo-signing \
            --key android-upload-key-wrap \
            --version 1 \
            --ciphertext-file "$root/pass.kms" \
            --plaintext-file "$root/roundtrip-pass.txt" >/dev/null
          cmp -s "$root/pass.txt" "$root/roundtrip-pass.txt"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$root/central.enc" -out "$root/roundtrip.tar.gz" -pass file:"$root/roundtrip-pass.txt"
          test "$(sha256sum "$root/central.tar.gz" | cut -d' ' -f1)" = "$(sha256sum "$root/roundtrip.tar.gz" | cut -d' ' -f1)"
          python3 - <<'PY'
          import base64, hashlib, json, pathlib
          root = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'kamilunavo-central-upload'
          cert_manifest = json.loads((root / 'manifest.json').read_text())
          cipher = (root / 'central.enc').read_bytes()
          wrapped = (root / 'pass.kms').read_bytes()
          envelope = {
            'schema': 1,
            'id': 'kamilunavo-central',
            'status': 'ACTIVE_LOCAL_IDENTITY',
            'kms_key_version': 'projects/emerald-caster-508318-f2/locations/global/keyRings/kamilunavo-signing/cryptoKeys/android-upload-key-wrap/cryptoKeyVersions/1',
            'encryption': 'AES-256-CBC-PBKDF2-SHA256-600000; RSA-OAEP-4096-SHA256',
            'certificate_sha1': cert_manifest['certificate_sha1'],
            'certificate_sha256': cert_manifest['certificate_sha256'],
            'ciphertext_sha256': hashlib.sha256(cipher).hexdigest(),
            'wrapped_passphrase_sha256': hashlib.sha256(wrapped).hexdigest(),
            'ciphertext_base64': base64.b64encode(cipher).decode(),
            'wrapped_passphrase_base64': base64.b64encode(wrapped).decode(),
          }
          pathlib.Path('.github/signing/kamilunavo-central-upload-key.kms.json').write_text(json.dumps(envelope, indent=2) + '\n')
          public = {
            'schema': 1,
            'id': 'kamilunavo-central',
            'algorithm': 'RSA-4096/SHA256withRSA',
            'certificate_sha1': cert_manifest['certificate_sha1'],
            'certificate_sha256': cert_manifest['certificate_sha256'],
            'certificate_file': 'kamilunavo-central-upload-certificate.pem',
            'private_key_storage': 'KMS-wrapped encrypted archive; never committed in plaintext',
          }
          pathlib.Path('generated/signing-central/central-upload-key-manifest.json').write_text(json.dumps(public, indent=2) + '\n')
          apps = [
            ('NavoKids','com.kamilunavo.navokids','MIGRATION_PLANNED'),
            ('ZweiCheck','de.kamilunavo.zweicheck','MIGRATION_PLANNED'),
            ('ArbeitsKlar','de.kamilunavo.arbeitsklar','RESET_REQUIRED_NOW'),
            ('WaermeTakt','de.kamilunavo.waermetakt','RESET_REQUIRED_NOW'),
            ('Reklaio','de.kamilunavo.reklaio','MIGRATION_PLANNED'),
            ('MaengelFix','com.kamilunavo.maengelfix','MIGRATION_PLANNED'),
            ('Kintaroq','com.kamilunavo.kintaroq','MIGRATION_PLANNED'),
            ('NavoPass','de.kamilunavo.navopass','MIGRATION_PLANNED'),
            ('99,9 %','de.kamilunavo.ninenine','MIGRATION_PLANNED'),
            ('NavoTap','com.kamilunavo.onemoretap','MIGRATION_PLANNED'),
            ('KaelteCalc','de.kamilunav.kaltecalc','MIGRATION_PLANNED'),
            ('LueftungsCalc','de.kamilunavo.luftungscalc','MIGRATION_PLANNED'),
            ('HeizkoerperCalc','de.kamilunavo.heizkorpercalc','MIGRATION_PLANNED'),
            ('RohrCalc','de.kamilunavo.rohrcalc','RESET_REQUIRED_NOW'),
            ('AnlagenCheck','de.kamilunavo.servicecheck','MIGRATION_PLANNED'),
            ('VolumeCalc','de.kamilunavo.volumecalc','MIGRATION_PLANNED'),
            ('KeepMeter','de.kamilunavo.keepmeter','MIGRATION_PLANNED'),
            ('Schon erledigt?','com.kamilunavo.schonerledigt','RESET_REQUIRED_NOW'),
            ('BrennerCalc','de.kamilunavo.brennercalc','MIGRATION_PLANNED'),
            ('HydroCalc','de.kamilunavo.hydrocalc','MIGRATION_PLANNED'),
            ('MAGCalc','de.kamilunavo.magcalc','MIGRATION_PLANNED'),
          ]
          migration = {'schema': 1, 'target_upload_certificate_sha1': cert_manifest['certificate_sha1'],
                       'target_upload_certificate_sha256': cert_manifest['certificate_sha256'],
                       'apps': [{'name': n, 'package': p, 'status': s} for n,p,s in apps]}
          pathlib.Path('generated/signing-central/android-upload-key-migration.json').write_text(json.dumps(migration, indent=2) + '\n')
          print('CENTRAL_UPLOAD_SHA1=' + cert_manifest['certificate_sha1'])
          print('CENTRAL_UPLOAD_SHA256=' + cert_manifest['certificate_sha256'])
          PY
      - name: Remove obsolete per-app reset candidates and persist central identity
        if: steps.existing.outputs.present != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kamilunavo Automation'
          git config user.email 'automation@kamilunavo.com'
          git rm -f .github/signing/pending-upload-reset-20260912.json 2>/dev/null || true
          git rm -rf generated/upload-key-reset-20260912 2>/dev/null || true
          git add .github/signing/kamilunavo-central-upload-key.kms.json generated/signing-central/
          if git diff --cached --name-only | grep -E '\.(jks|p12|keystore)$'; then
            echo '::error::Plaintext keystore must never be committed.'
            exit 1
          fi
          if git diff --cached --no-color | grep -E 'BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY'; then
            echo '::error::Private key material detected in staged diff.'
            exit 1
          fi
          git commit -m 'security: adopt one central Kamilunavo Android upload key'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'One central Kamilunavo Android upload identity created, KMS round-trip verified and old per-app reset candidates retired.' >> "$GITHUB_STEP_SUMMARY"
      - name: Export central public certificate for Play Console resets
        if: steps.existing.outputs.present != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kamilunavo-central-google-play-upload-certificate
          path: |
            generated/signing-central/kamilunavo-central-upload-certificate.pem
            generated/signing-central/central-upload-key-manifest.json
            generated/signing-central/android-upload-key-migration.json
          if-no-files-found: error
          retention-days: 90
      - name: Destroy temporary plaintext signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/kamilunavo-central-upload"
