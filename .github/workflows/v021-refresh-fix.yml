name: MängelFix v0.21 Refresh Fix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v021-refresh-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/v021_refresh_fix.py
      - run: cd client && npm install --no-audit --no-fund && npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.jsx
          if git diff --cached --quiet; then echo "Nothing to commit"; else git commit -m "Fix management workspace state refresh" && git push; fi
