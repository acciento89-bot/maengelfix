name: Fix iOS Safari HTML delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ios-inline-html.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply fix
        run: python3 scripts/fix_ios_inline_html.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix iOS Safari treating app pages as downloads"
            git push
          fi
