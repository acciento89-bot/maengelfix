name: MängelFix Android Store Screenshots

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/scripts/capture-android-store-screenshots.sh'
      - '.github/workflows/android-store-screenshots.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/scripts/capture-android-store-screenshots.sh'
      - '.github/workflows/android-store-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build current debug APK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          gradle -p android assembleDebug --stacktrace
      - name: Enable KVM acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Capture real native UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: PACKAGE_NAME='com.kamilunavo.maengelfix' APK_PATH='android/app/build/outputs/apk/debug/app-debug.apk' OUTPUT_DIR='android/store/google-play/screenshots/de-DE' WAIT_TEXT='Willkommen zurück' SECOND_ACTION='tap' SECOND_TEXT='Registrieren' SECOND_WAIT_TEXT='Dein Name' bash "$GITHUB_WORKSPACE/.github/scripts/capture-android-store-screenshots.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: MaengelFix-authentic-Android-store-screenshots
          path: android/store/google-play/screenshots/de-DE/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Persist verified emulator screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/store/google-play/screenshots/de-DE
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'store(android): refresh authentic MängelFix screenshots'
          git push
