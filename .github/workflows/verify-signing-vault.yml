name: Verify Android signing vault

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/restore-android-signing/action.yml'
      - '.github/workflows/verify-signing-vault.yml'
      - 'generated/signing-vault/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app-id:
          - maengelfix
          - brennercalc
          - kaltecalc
          - ninenine
          - idlehandwerker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore signing identity
        uses: ./.github/actions/restore-android-signing
        with:
          app-id: ${{ matrix.app-id }}
      - name: Verify runtime material only
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ANDROID_UPLOAD_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_UPLOAD_KEYSTORE_PATH" \
            -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_UPLOAD_KEY_ALIAS" >/dev/null
          echo "${{ matrix.app-id }} signing identity verified"
      - name: Destroy restored material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/kamilunavo-upload.jks"
          rm -rf "$RUNNER_TEMP/kamilunavo-signing-vault"
